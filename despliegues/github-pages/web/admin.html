<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel docente · Detectives de la desinformación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Special+Elite&display=swap">
<link rel="stylesheet" href="/static/css/reto.css">
<style>
  main { max-width: 1400px; }
  .pasos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 8px 0 18px; counter-reset: paso; }
  .paso { position: relative; padding: 14px 14px 12px 50px; border: 2px solid var(--linea-2); background: var(--tarjeta); margin-right: -2px; }
  .paso:first-child { border-radius: 10px 0 0 10px; }
  .paso:last-child { border-radius: 0 10px 10px 0; }
  .paso::before { counter-increment: paso; content: counter(paso); position: absolute; left: 14px; top: 13px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font: 700 14px var(--f-titulo); }
  .paso b { display: block; font-family: var(--f-titulo); font-size: 17px; }
  .paso span { font-size: 13px; color: var(--tinta-3); }
  .paso.hecho { color: var(--tinta-3); background: var(--papel-2); }
  .paso.actual { background: var(--tinta); color: var(--papel); border-color: var(--tinta); z-index: 1; }
  .paso.actual span { color: var(--papel-2); }
  @media (max-width: 800px) { .pasos { grid-template-columns: 1fr 1fr; } .paso { margin: 0 0 -2px 0; border-radius: 0 !important; } }
  .controles { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .rejilla-adm { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin: 20px 0; }
  @media (max-width: 1000px) { .rejilla-adm { grid-template-columns: 1fr; } }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpis div { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 10px; padding: 12px 14px; }
  .kpis span { display: block; font-size: 13px; color: var(--tinta-3); }
  .kpis b { font: 800 30px/1.1 var(--f-titulo); }
  .url { font: 16px var(--f-maquina); background: var(--amarillo-suave); padding: 4px 8px; border-radius: 6px; display: inline-block; margin: 2px 0; word-break: break-all; }
  .interruptor { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--linea-2); }
  .interruptor small { display: block; color: var(--tinta-3); }
  .interruptor input { width: 22px; height: 22px; accent-color: var(--tinta); flex: none; }
  .fila-cfg { display: flex; gap: 8px; align-items: end; margin-top: 10px; }
  .fila-cfg .campo { margin: 0; flex: 1; }
  .fila-cfg .entrada { padding: 8px 10px; }
  .boton.chico { padding: 7px 12px; font-size: 14px; box-shadow: 2px 2px 0 var(--linea-2); }
  .filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .filtros .entrada { width: auto; padding: 8px 12px; }
  .tabla-wrap { overflow-x: auto; background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 10px; }
  table.participantes { border-collapse: collapse; width: 100%; font-size: 14px; }
  .participantes th { text-align: left; background: var(--tinta); color: var(--papel); padding: 9px 10px; white-space: nowrap; position: sticky; top: 0; }
  .participantes td { padding: 8px 10px; border-bottom: 1px solid var(--linea); vertical-align: middle; }
  .participantes td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .participantes tr.podio-1 td:first-child { box-shadow: inset 6px 0 0 #d4a017; }
  .participantes tr.podio-2 td:first-child { box-shadow: inset 6px 0 0 #9aa3ad; }
  .participantes tr.podio-3 td:first-child { box-shadow: inset 6px 0 0 #b2703d; }
  .participantes .puesto { font: 800 20px var(--f-titulo); }
  .participantes .quien b { display: block; }
  .participantes .quien small { color: var(--tinta-3); }
  .estado { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; background: var(--papel-2); white-space: nowrap; }
  .estado.en_curso { background: var(--amarillo); }
  .estado.finalizado { background: var(--verde-suave); color: var(--verde); }
  .estado.descalificado, .estado.no_inicio { background: var(--rojo-suave); color: var(--rojo); }
  .progreso { width: 110px; height: 8px; background: var(--papel-2); border-radius: 99px; overflow: hidden; }
  .progreso i { display: block; height: 100%; background: var(--tinta); }
  .alerta-salidas { color: var(--rojo); font-weight: 700; }
  .acciones-fila { display: flex; gap: 6px; }
  .acciones-fila button { border: 1px solid var(--linea-2); background: var(--tarjeta); border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .acciones-fila button:hover { border-color: var(--tinta); }
  .exp-fila { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--linea); font-size: 15px; }
  .exp-fila b { font-family: var(--f-titulo); }
  .peligro-zona { border: 2px dashed var(--rojo); border-radius: 10px; padding: 16px; margin-top: 30px; }
  #login { max-width: 460px; margin: 60px auto; }
  .reloj-caja { background: var(--tinta); color: var(--papel); border-radius: 10px; padding: 8px 16px; text-align: center; }
  .reloj-caja small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
  .reloj-adm { font: 800 38px/1.05 var(--f-titulo); font-variant-numeric: tabular-nums; min-width: 150px; }
  .reloj-adm.alerta { color: var(--amarillo); } .reloj-adm.critico { color: #ff7a6b; } .reloj-adm.pausa { color: #bdb6a4; }
  textarea.entrada { width: 100%; resize: vertical; font: inherit; }
</style>
</head>
<body>
<header class="cabecera">
  <div class="cabecera-in">
    <span class="marca"><span class="marca-texto">Panel docente<small>DETECTIVES DE LA DESINFORMACIÓN</small></span></span>
    <a class="ficha" id="ir-tablero" href="/tablero" target="_blank" rel="noopener" style="text-decoration:none">Abrir tablero para proyectar ↗</a>
  </div>
</header>
<main id="app"></main>
<script src="/static/js/admin.js"></script>
</body>
</html>
