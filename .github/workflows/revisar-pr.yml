# Revisión automática de cada PR hacia develop o main.
# Corre los mismos ganchos de pre-commit que cada persona tiene en su máquina, así nadie se
# los salta: archivos, simulacro (si cambia el servidor, el banco o las pantallas), mensajes
# de commit, título del PR y tamaño máximo de 400 líneas de código.
name: Revisar PR

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      CABEZA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Ganchos sobre los archivos del PR
        run: pre-commit run --show-diff-on-failure --from-ref "$BASE" --to-ref "$CABEZA"

      - name: Simulacro de 40 participantes (si aplica)
        run: pre-commit run --hook-stage pre-push --from-ref "$BASE" --to-ref "$CABEZA"

      - name: Mensajes de commit
        run: |
          fallo=0
          for sha in $(git rev-list --no-merges "$BASE..$CABEZA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/mensaje.txt"
            echo "== $(git log -1 --format='%h %s' "$sha")"
            python .github/scripts/revisar_mensaje_commit.py "$RUNNER_TEMP/mensaje.txt" || fallo=1
            pre-commit run prohibir-atribucion-ia --hook-stage commit-msg \
              --commit-msg-filename "$RUNNER_TEMP/mensaje.txt" || fallo=1
          done
          exit "$fallo"

      - name: Título del PR (es el mensaje del commit al fusionar con squash)
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITULO" > "$RUNNER_TEMP/titulo.txt"
          python .github/scripts/revisar_mensaje_commit.py "$RUNNER_TEMP/titulo.txt"

      - name: Tamaño (máximo 400 líneas de código)
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          # Un PR «style:» que solo toca .py sin cambiar su árbol sintáctico queda exento (ADR-008).
          if [[ "$TITULO" == style:* ]] && python - <<'PY'
          import ast, os, subprocess, sys
          cabeza = os.environ["CABEZA"]
          base = subprocess.run(["git", "merge-base", os.environ["BASE"], cabeza],
                                capture_output=True, text=True, check=True).stdout.strip()
          archivos = subprocess.run(["git", "diff", "--name-only", f"{base}...{cabeza}"],
                                    capture_output=True, text=True, check=True).stdout.split()
          def arbol(ref, ruta):
              return ast.dump(ast.parse(subprocess.run(["git", "show", f"{ref}:{ruta}"],
                                                       capture_output=True, text=True, check=True).stdout))
          sys.exit(0 if archivos and all(r.endswith(".py") and arbol(base, r) == arbol(cabeza, r)
                                         for r in archivos) else 1)
          PY
          then
            echo "PR de solo formato: mismo árbol sintáctico en cada .py; exento del límite."
            exit 0
          fi
          git diff --numstat "$BASE...$CABEZA" -- . ':(exclude)*.md' ':(exclude)aidlc/' \
            ':(exclude)1_Analisis_de_datos/' ':(exclude)2_Aplicacion_Reto/banco_preguntas.json' ':(exclude)uv.lock' \
            | awk '{a+=$1; b+=$2} END {
                print "Líneas de código: +" a+0 " / -" b+0 " = " a+b
                if (a+b > 400) { print "Pasa de 400 líneas: divide el PR."; exit 1 }
              }'
